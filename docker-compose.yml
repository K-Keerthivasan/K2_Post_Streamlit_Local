services:
  k2-posttool:
    build: .
    container_name: k2-posttool
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434/v1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./outputs:/app/outputs
      - ./image_cache:/app/image_cache
      - ./library:/app/library
      - ./config.yaml:/app/config.host.yaml:ro
      - ./content_profile.md:/app/content_profile.md
      - ./templates:/app/templates
      - ./static:/app/static
      - ./Assets:/app/Assets
    restart: unless-stopped

  k2-posttool-tailscale:
    image: tailscale/tailscale:stable
    container_name: k2-posttool-tailscale
    profiles:
      - tailscale
    env_file:
      - path: .env.tailscale
        required: false
    environment:
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: "k2-posttool"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ./tailscale:/config
      - ./tailscale/state:/var/lib/tailscale
    network_mode: "service:k2-posttool"
    depends_on:
      - k2-posttool
    restart: unless-stopped
