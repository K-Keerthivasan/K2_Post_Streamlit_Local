# ─────────────────────────────────────────────────────────────────────────────
# Example configuration. Copy this file to `config.yaml` and edit it with your
# own brand(s), feeds, and Meta accounts. `config.yaml` is gitignored so your
# real details never get committed. The app auto-copies this file to config.yaml
# on first run if one doesn't exist.
# ─────────────────────────────────────────────────────────────────────────────

app:
  name: "Post Studio"        # shown as the browser tab title

# Which brand the app is currently posting for. Switch in the header dropdown.
active_brand: demo

# ── Publishing: Instagram + Facebook via the Meta Graph API ───────────────────
# Direct publishing with your own Meta credentials. Engine + CLI: meta.py.
# Check your setup any time with:  python meta.py --verify
#
# You need a Meta app with the Instagram Graph API product, an Instagram
# Business/Creator account linked to a Facebook Page, and a long-lived token with
# instagram_basic, instagram_content_publish, pages_show_list,
# pages_read_engagement and pages_manage_posts. Put the token in .env as
# META_ACCESS_TOKEN — never in this file.
#
# Instagram also needs PUBLIC_BASE_URL in .env: Meta fetches the rendered images
# from your machine, so a localhost address can never work.
meta:
  api_version: "v21.0"
  token_env: "META_ACCESS_TOKEN"     # global default; override per account below
  accounts:
    # One entry per brand key under `brands:` below.
    demo:
      ig_user_id: ""                 # Instagram Business account id, not the @handle
      fb_page_id: ""                 # linked Facebook Page id (optional)
      targets: ["instagram"]         # instagram | facebook | both
      # login: instagram             # set when the token came from Instagram
                                     # business login (graph.instagram.com).
                                     # Omit for Graph API Explorer / FB Login
                                     # tokens - each host rejects the other's.
      # token_env: "META_ACCESS_TOKEN_DEMO"   # per-brand token, if they differ
  publish:
    default_targets: ["instagram"]
    on_approve: "hold"           # hold = approve then schedule/publish yourself
                                 # now  = approving publishes immediately
    allow_now: true
  rate_limit:
    max_posts_per_day: 25        # Instagram's own 24h ceiling
    safety_margin: 2

# ── Post calendar ─────────────────────────────────────────────────────────────
# Slots the Calendar tab auto-fill uses, plus the background publisher that sends
# a scheduled post when its time arrives. Local time.
schedule:
  times: ["09:00", "13:00", "18:00"]
  days:  ["mon", "tue", "wed", "thu", "fri"]
  auto_publish: true             # false = the calendar plans but never sends
  tick_seconds: 60

# ── Brands ────────────────────────────────────────────────────────────────────
# Add as many brands as you like; each carries its own copy, theme, scoring
# profile, and feeds. Templates are shared — only the brand vars + theme change.
brands:

  demo:
    name:      "Your Brand"
    short:     "YB"
    author:    "Your Name"
    handle:    "@yourbrand"
    instagram: "yourbrand"
    tagline:   "Your tagline goes here"
    pitch:     "What you do, in one line."
    services:  "Service 1 · Service 2 · Service 3"
    location:  "Your City"
    website:   "yourbrand.com"
    email:     "hello@yourbrand.com"
    category:  "YOUR NICHE"
    logo_path: "static/logo.png"        # drop your logo here (circular mark works best)
    hashtags:  ["yourbrand", "marketing", "socialmedia"]
    theme:
      navy:    "#0A0F1E"   # background base
      navy2:   "#0C1426"
      accent:  "#00B4C8"   # primary accent
      accent2: "#00C896"   # secondary accent
      text:    "#FFFFFF"
    video:
      enabled: true
      color_grade:
        overlay: "#0A0F1E"
        opacity: 0.15
      captions:
        font_size:  54
        text_color: "#FFFFFF"
        box_opacity: 0.55
        position:   0.74
      hook_card:
        enabled:    true
        duration:   2.0
        bg:         "#0A0F1E"
        text_color: "#FFFFFF"
        accent:     "#00B4C8"
      end_card:
        enabled:    true
        duration:   3.0
        bg:         "#0A0F1E"
        text_color: "#FFFFFF"
        accent:     "#00B4C8"
        cta:        "Link in bio"
    profile: >
      Describe your niche, audience, and what kinds of stories should score high.
      The local AI uses this to rank fetched stories 0-100. Be specific about what
      to reward and what to penalise.
    personality: >
      Describe your brand voice. The AI rewrites copy in this voice on a final
      pass. Mention tone, what to emphasise, and words/styles to avoid.
    scoring_guidance: >
      Prioritize stories that match the brand's niche and audience. Reward content
      that can be turned into a clear, engaging post and penalize off-topic material.
    # The Create tab shows this brand-specific list. Each value must have matching
    # guidance in plan.py's CONTENT_TYPE_GUIDANCE registry.
    content_types:
      - value: educational
        label: "Educational / how-to"
        description: "Teach the audience something practical they can use."
      - value: thought_leadership
        label: "Thought leadership / opinion"
        description: "Present a clear position and explain why it matters."
      - value: promotional
        label: "Promotional / offer"
        description: "Connect an offer to the audience problem and benefit."
    feeds:
      categories:
        tech:
          name:    "Tech"
          enabled: true
          urls:
            - "https://techcrunch.com/feed"
            - "https://www.theverge.com/rss/index.xml"
        marketing:
          name:    "Marketing"
          enabled: true
          urls:
            - "https://blog.hubspot.com/marketing/rss.xml"
            - "https://searchengineland.com/feed"
        youtube:
          name:    "YouTube"
          enabled: true
          urls:
            # Channel feed: https://www.youtube.com/feeds/videos.xml?channel_id=<ID>
            - "https://www.youtube.com/feeds/videos.xml?channel_id=UC2Xd-TjJByJyK2w1zNwY0zQ"

llm:
  # Active backend on boot. Switch live in the header "Engine" dropdown.
  # env K2_LLM_* still wins on boot. Hermes is a local CLI; Ollama is an HTTP server.
  base_url: "hermes://cli"
  model:    "hermes:gpt-5.5"
  format:   "json"
  backends:
    hermes:
      base_url: "hermes://cli"
      model:    "hermes:gpt-5.5"
    ollama:
      base_url: "http://localhost:11434/v1"
      model:    "qwen3:8b"

output:
  width:     1080
  height:    1350
  directory: "outputs"

# Image sourcing: pexels, unsplash, google (needs GOOGLE_API_KEY + GOOGLE_CSE_ID
# in .env). The filter is baked into web/Google images on download (Pillow).
images:
  filter:
    enabled:    true
    saturation: 0.85
    brightness: 0.95
    contrast:   1.05

slides:
  min_content_cards: 1    # min total = 3 (title + 1 + outro)
  max_content_cards: 8    # max total = 10 (title + 8 + outro)
  default_total:     4
  short_story:
    max_summary_words: 220
    content_cards:     2
  long_story:
    min_summary_words: 221
    content_cards:     4

# Post formats. "carousel"/"listicle" are multi-slide; the rest are single cards.
formats:
  carousel:
    name:   "Carousel"
    width:  1080
    height: 1350
    type:   multi
  cover:
    name:     "Brand Cover"
    width:    1080
    height:   1350
    type:     single
    template: cover.html
  square:
    name:     "Square Post"
    width:    1080
    height:   1080
    type:     single
    template: square.html
  story:
    name:     "Story"
    width:    1080
    height:   1920
    type:     single
    template: story.html
  x:
    name:     "X / Twitter"
    width:    1600
    height:   900
    type:     single
    template: xpost.html
  quote:
    name:     "Quote / Stat"
    width:    1080
    height:   1350
    type:     single
    template: quote.html
  comparison:
    name:     "Comparison / VS"
    width:    1080
    height:   1350
    type:     single
    template: comparison.html
  breaking:
    name:     "Breaking / Hot Take"
    width:    1080
    height:   1350
    type:     single
    template: breaking.html
  listicle:
    name:   "Listicle / Top-N"
    width:  1080
    height: 1350
    type:   multi
  linkedin:
    name:     "LinkedIn"
    width:    1200
    height:   1200
    type:     single
    template: linkedin.html
    # brands: ["demo"]   # uncomment to restrict a format to specific brand keys
